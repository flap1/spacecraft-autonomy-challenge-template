name: Python quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: '0.13.4'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint Python
        run: uv run --locked ruff check .
      - name: Check strategy types
        run: uv run --locked mypy
      - name: Check notebook
        run: uv run --locked marimo check --strict app.py
      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Evaluate packed submission
        run: uv run --locked autonomy-challenge check
